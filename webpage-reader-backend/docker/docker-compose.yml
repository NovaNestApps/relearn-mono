services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reader_user
      POSTGRES_PASSWORD: reader_pass
      POSTGRES_DB: webpage_reader
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    command: serve

  # Optional: Adminer for DB management
  adminer:
    image: adminer
    ports:
      - "8080:8080"