<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Summaries - Relearn</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="summaries.css">
</head>
<body>

<div class="summaries-container">

    <!-- Header bar -->
    <header class="summaries-header">
        <div class="header-top">
            <div class="header-left">
                <h1 class="header-title">My Summaries</h1>
                <div id="syncStatus" class="sync-status">Loading...</div>
            </div>
            <div class="header-actions">
                <button id="syncBtn" class="btn-icon-header" title="Sync">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                </button>
                <button id="exportBtn" class="btn-header-action" title="Export">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Export
                </button>
            </div>
        </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="search-box">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search summaries...">
        </div>
        <div class="toolbar-right">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="synced">Synced</button>
                <button class="filter-btn" data-filter="local">Local</button>
            </div>
            <select id="sortSelect" class="sort-select">
                <option value="date-desc">Newest</option>
                <option value="date-asc">Oldest</option>
                <option value="title-asc">A → Z</option>
                <option value="title-desc">Z → A</option>
            </select>
        </div>
    </div>

    <!-- Meta row -->
    <div class="meta-row">
        <span id="summaryCount" class="summary-count">0 Summaries</span>
        <button id="clearAllBtn" class="btn-text-danger">Clear All</button>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="loading-spinner hidden">
        <div class="spinner"></div>
        <p>Loading summaries...</p>
    </div>

    <!-- Summaries Grid -->
    <div id="summariesGrid" class="summaries-grid hidden"></div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">📭</div>
        <h2 class="empty-title">No summaries yet</h2>
        <p class="empty-text">Start reading webpages to create your first summary.</p>
    </div>

</div>

<!-- API Service -->
<script src="../services/api-service.js"></script>

<!-- Storage Manager -->
<script src="storage.js"></script>

<!-- Summaries Script -->
<script src="summaries.js"></script>

</body>
</html>
