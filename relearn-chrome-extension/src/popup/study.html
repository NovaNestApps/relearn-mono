<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Mode - Relearn</title>
  <link rel="stylesheet" href="study.css">
</head>
<body>
  <div class="study-container">
    <!-- Header -->
    <header class="study-header">
      <button class="back-btn" id="backBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <div class="header-info">
        <h1 class="study-title">Study Mode</h1>
        <p class="study-subtitle" id="summaryTitle">Loading...</p>
      </div>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v6m0 6v6m5.2-13.2l-4.2 4.2m0 6l4.2 4.2M23 12h-6m-6 0H1m18.2-5.2l-4.2 4.2m0 6l4.2 4.2"></path>
        </svg>
      </button>
    </header>

    <!-- Progress Bar -->
    <div class="progress-container">
      <div class="progress-info">
        <span class="progress-text" id="progressText">Card 1 of 10</span>
        <span class="progress-stats" id="progressStats">Know: 0 | Don't Know: 0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Main Study Area -->
    <main class="study-main">
      <!-- Flashcard -->
      <div class="flashcard-wrapper">
        <div class="flashcard-container" id="flashcardContainer">
          <div class="flashcard-inner" id="flashcardInner">
            <div class="flashcard-face flashcard-front">
              <div class="card-label">Question</div>
              <div class="card-content" id="cardFront">Click to reveal answer</div>
              <div class="card-hint">
                <span class="tap-hint">👆 Tap to flip</span>
              </div>
            </div>
            <div class="flashcard-face flashcard-back">
              <div class="card-label">Answer</div>
              <div class="card-content" id="cardBack">Answer will appear here</div>
              <div class="card-tags" id="cardTags"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Buttons (shown after flip) -->
      <div class="action-buttons hidden" id="actionButtons">
        <button class="action-btn dont-know-btn" id="dontKnowBtn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
          </svg>
          <span>Don't Know</span>
          <span class="btn-hint">Review again soon</span>
        </button>
        <button class="action-btn know-btn" id="knowBtn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          <span>Know It!</span>
          <span class="btn-hint">Mark as learned</span>
        </button>
      </div>

      <!-- Navigation Buttons (shown on front) -->
      <div class="nav-buttons" id="navButtons">
        <button class="nav-btn" id="prevBtn" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Previous
        </button>
        <button class="nav-btn nav-btn-primary" id="nextBtn">
          Next
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </main>

    <!-- Completion Screen -->
    <div class="completion-screen hidden" id="completionScreen">
      <div class="completion-content">
        <div class="completion-icon">🎉</div>
        <h2 class="completion-title">Study Session Complete!</h2>
        <div class="completion-stats">
          <div class="stat-card">
            <div class="stat-number" id="totalCards">0</div>
            <div class="stat-label">Total Cards</div>
          </div>
          <div class="stat-card stat-success">
            <div class="stat-number" id="knownCards">0</div>
            <div class="stat-label">Know</div>
          </div>
          <div class="stat-card stat-warning">
            <div class="stat-number" id="unknownCards">0</div>
            <div class="stat-label">Need Review</div>
          </div>
        </div>
        <div class="completion-actions">
          <button class="btn-secondary" id="reviewAgainBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            Review Again
          </button>
          <button class="btn-primary" id="finishBtn">Finish</button>
        </div>
      </div>
    </div>

    <!-- Loading State -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-spinner"></div>
      <p class="loading-text">Loading flashcards...</p>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="study.js"></script>
</body>
</html>
